<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WIFI PACKAGE</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  font-family: Arial, sans-serif;
  color: #0d1b2c;
  background: #aadbff; /* Light blue background like picture */
  position: relative;
  overflow-x: hidden;
}

/* Background watermark text & shapes */
.bg-text {
  position: fixed;
  top: 2%;
  left: 2%;
  font-size: 70px;
  font-weight: 900;
  color: rgba(255, 255, 255, 0.6);
  pointer-events: none;
  z-index: 0;
}
.bg-face {
  position: fixed;
  bottom: 2%;
  right: 2%;
  font-size: 80px;
  color: rgba(255, 255, 255, 0.6);
  pointer-events: none;
  z-index: 0;
}

/* Card base */
.card {
  width: 100%;
  max-width: 360px;
  padding: 30px 25px;
  border-radius: 30px;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
  position: relative;
  z-index: 1;
}

/* Light Card Style */
.card-light {
  background: #ffffff;
  text-align: center;
}

.light-title {
  margin: 0 0 8px;
  font-size: 26px;
  font-weight: 700;
  color: #000;
}

.light-sub {
  color: #8fa0b5;
  margin: 0 0 20px;
  font-size: 14px;
}

/* Inputs */
.light-input {
  width: 100%;
  padding: 12px 5px;
  margin: 10px 0;
  border: none;
  border-bottom: 1.5px solid #e1e8f0;
  background: transparent;
  color: #0d1b2c;
  font-size: 14px;
  outline: none;
}
.light-input:focus {
  border-color: #0d1b2c;
}
.light-input::placeholder {
  color: #b0bec5;
}

/* Buttons */
.btn-outline {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border: 1.5px solid #000;
  border-radius: 25px;
  background: transparent;
  color: #000;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

.btn-filled {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: 1.5px solid #000;
  border-radius: 25px;
  background: #cbe8ff;
  color: #000;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

.btn-action {
  width: 100%;
  padding: 14px;
  margin-top: 25px;
  border: 1.5px solid #000;
  border-radius: 25px;
  background: #e5e9f0;
  color: #000;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

button:active {
  transform: scale(0.98);
}

/* Links */
.link-text {
  margin-top: 20px;
  font-size: 13px;
  color: #8fa0b5;
}
.link-btn {
  color: #000;
  font-weight: bold;
  cursor: pointer;
  text-decoration: underline;
}

/* Illustration Placeholder */
.illustration {
  width: 100%;
  height: 180px;
  margin: 15px 0 25px;
  display: flex;
  justify-content: center;
  align-items: center;
}
.illustration svg {
  width: 100%;
  height: 100%;
}

/* Header Art for Signup */
.signup-art {
  width: 100%;
  height: 90px;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Dark Card (Dashboard) */
.card-dark {
  background: rgba(13, 27, 44, 0.97);
  border: 1px solid rgba(255, 255, 255, 0.12);
  color: white;
  text-align: center;
}
.card-dark h1 { margin: 0 0 7px; font-size: 26px; }
.card-dark .sub { color: #9eacbf; margin: 0 0 20px; }
.info { text-align: left; background: #091625; border-radius: 15px; padding: 15px; margin-top: 12px; }
.label { font-size: 11px; color: #8fa0b5; text-transform: uppercase; }
.value { margin-top: 5px; font-size: 18px; font-weight: bold; word-break: break-all; }
.pass { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.copy { width: auto; margin: 0; padding: 8px 12px; font-size: 12px; background: #263b54; color: white; border: 0; cursor: pointer; border-radius: 10px; }
.logout { width: 100%; padding: 14px; border: 0; border-radius: 12px; background: #202e41; color: white; font-size: 15px; font-weight: bold; margin-top: 18px; cursor: pointer; }

#error {
  min-height: 20px;
  margin-top: 10px;
  color: #ff687b;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="bg-text">BOOM!</div>
<div class="bg-face">✕‿✕</div>

<!-- 1. WELCOME SCREEN -->
<div class="card card-light" id="screen-welcome">
  <div class="light-title">Wellcome</div>
  <div class="light-sub">Here you log in securely</div>

  <div class="illustration">
    <svg viewBox="0 0 200 150" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="40" cy="50" r="15" fill="#cbe8ff"/>
      <rect x="30" y="80" width="140" height="40" rx="10" fill="#e2eeff"/>
      <path d="M70 100 C70 80, 90 80, 90 100" stroke="#000" stroke-width="3" fill="none"/>
      <circle cx="80" cy="70" r="8" fill="#000"/>
      <polygon points="170,40 180,55 160,55" stroke="#000" stroke-width="1.5" fill="none"/>
      <circle cx="165" cy="85" r="5" stroke="#000" stroke-width="1.5" fill="none"/>
    </svg>
  </div>

  <button class="btn-outline" onclick="showScreen('screen-login')">Log in</button>
  <button class="btn-filled" onclick="showScreen('screen-signup')">Sign Up</button>
</div>


<!-- 2. LOGIN SCREEN -->
<div class="card card-light" id="screen-login" style="display: none;">
  <div class="light-title">Log in</div>
  <div class="light-sub">Enter your WiFi Package details</div>

  <input id="username" type="text" placeholder="Username" class="light-input" autocomplete="username">
  <input id="password" type="password" placeholder="Password" class="light-input" autocomplete="current-password">

  <div id="error"></div>

  <button class="btn-action" onclick="login()">Log In</button>

  <div class="link-text">
    Don't have an account? <span class="link-btn" onclick="showScreen('screen-signup')">Sign Up</span>
  </div>
</div>


<!-- 3. SIGNUP SCREEN -->
<div class="card card-light" id="screen-signup" style="display: none;">
  <div class="signup-art">
    <svg viewBox="0 0 100 60" width="80" height="50">
      <path d="M50 5 Q60 25 50 50 M50 15 Q70 10 75 25 M50 25 Q70 25 70 40 M50 15 Q30 10 25 25 M50 25 Q30 25 30 40" stroke="#000" stroke-width="2" fill="none"/>
    </svg>
  </div>

  <div class="light-title">Sign up</div>
  <div class="light-sub">Create an account, It's free</div>

  <input type="email" placeholder="Email" class="light-input">
  <input type="password" placeholder="Password" class="light-input">
  <input type="password" placeholder="Confirm Password" class="light-input">

  <button class="btn-action" onclick="showScreen('screen-login')">Sign Up</button>

  <div class="link-text">
    Already have an account? <span class="link-btn" onclick="showScreen('screen-login')">Log In</span>
  </div>
</div>


<!-- 4. DASHBOARD SCREEN -->
<div class="card card-dark" id="screen-dashboard" style="display: none;">
  <div style="font-size: 45px; margin-bottom: 10px;">📶</div>
  <h1>WIFI PACKAGE</h1>
  <p class="sub">Your WiFi details</p>

  <div class="info">
    <div class="label">WiFi Name (SSID)</div>
    <div class="value">Anas Malik</div>
  </div>

  <div class="info">
    <div class="label">WiFi Password</div>
    <div class="pass">
      <div class="value" id="wifiPass">malikx777</div>
      <button class="copy" onclick="copyPass()">COPY</button>
    </div>
  </div>

  <button class="logout" onclick="logout()">LOGOUT</button>
</div>


<script>
// Credentials
const USERNAME = "anasx777";
const LOGIN_PASSWORD = "aass1122";

// Screen Switcher
function showScreen(screenId) {
  document.getElementById("screen-welcome").style.display = "none";
  document.getElementById("screen-login").style.display = "none";
  document.getElementById("screen-signup").style.display = "none";
  document.getElementById("screen-dashboard").style.display = "none";

  document.getElementById(screenId).style.display = "block";
}

// Login logic
function login() {
  const user = document.getElementById("username").value.trim();
  const pass = document.getElementById("password").value;
  const error = document.getElementById("error");

  if (user === USERNAME && pass === LOGIN_PASSWORD) {
    error.textContent = "";
    showScreen("screen-dashboard");
  } else {
    error.textContent = "❌ Incorrect username or password";
  }
}

// Copy password
function copyPass() {
  navigator.clipboard.writeText("malikx777").then(function() {
    const btn = document.querySelector(".copy");
    btn.textContent = "COPIED ✓";
    setTimeout(() => { btn.textContent = "COPY"; }, 1500);
  });
}

// Logout
function logout() {
  document.getElementById("username").value = "";
  document.getElementById("password").value = "";
  document.getElementById("error").textContent = "";
  showScreen("screen-welcome");
}
</script>

</body>
</html>
