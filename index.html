<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WIFI PACKAGE</title>

<style>
/* Reset and global styles */
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content:center;
  padding: 20px;
  font-family: Arial, sans-serif;
  color: white;
  background-color: #0d1b2c; /* Background color of the original code */
}

/* Card base styles (all cards in the HTML) */
.card {
  width: 100%;
  max-width: 390px;
  padding: 28px;
  border-radius: 24px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
}

/* Styles specific to original dark cards (Dashboard) */
.card-dark {
  background: rgba(13, 27, 44, .97);
  border: 1px solid rgba(255, 255, 255, 0.12);
  text-align: center;
}

/* Base element styles within dark cards */
.icon { font-size: 55px; margin-bottom: 8px; }
h1.dark { margin: 0 0 7px; font-size: 28px; }
.sub.dark { color: #9eacbf; margin: 0 0 22px; }

input.dark {
  width: 100%;
  padding: 15px;
  margin: 7px 0;
  border: 1px solid #33445b;
  border-radius: 12px;
  background: #091625;
  color: white;
  font-size: 16px;
  outline: none;
}
input.dark:focus { border-color: #32d7ff; }

button.dark {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: 0;
  border-radius: 12px;
  background: #20c9ed;
  color: #03121a;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}
button.dark:active { transform: scale(.98); }

#error-dark {
  min-height: 22px;
  margin-top: 12px;
  color: #ff687b;
  text-align: center;
}

/* Dashboard-specific info displays */
.info { text-align: left; background: #091625; border-radius: 15px; padding: 17px; margin-top: 12px; }
.label { font-size: 12px; color: #8fa0b5; text-transform: uppercase; }
.value { margin-top: 6px; font-size: 20px; font-weight: bold; word-break: break-all; }
.pass { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.copy { width: auto; margin: 0; padding: 9px 12px; font-size: 13px; background: #263b54; color: white; border: 0; cursor: pointer; border-radius: 12px; }
.logout.dark { background: #202e41; color: white; margin-top: 18px; }


/* Styles specific to NEW white cards (Login and Sign Up) */
.card-light {
  background: white;
  color: #0d1b2c; /* Dark text */
  text-align: center;
}

/* New heading and text styles for light cards */
.light-title {
  margin: 0 0 10px;
  font-size: 28px;
  font-weight: bold;
}
.light-sub {
  color: #8fa0b5;
  margin: 0 0 25px;
  font-size: 14px;
}

/* Sign Up card visual elements */
.sign-up-header {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  padding-top: 40px; /* Room for shapes */
  margin-bottom: 20px;
}
.circle-top-left {
  position: absolute;
  top: 0px;
  left: 0px;
  width: 18px; height: 18px;
  border-radius: 50%;
  border: 1.5px solid #0d1b2c;
  background: transparent;
}
.circle-right-upper {
  position: absolute;
  top: 50px;
  right: 15px;
  width: 25px; height: 25px;
  border-radius: 50%;
  border: 1.5px solid #0d1b2c;
  background: transparent;
}
.circle-right-lower {
  position: absolute;
  top: 90px;
  right: 10px;
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1.5px solid #0d1b2c;
  background: transparent;
}
/* This is a simple placeholder SVG path for the foliage */
.foliage {
  margin: 0 auto;
}

/* Input fields for light cards */
.light-input {
  width: 100%;
  padding: 15px 5px; /* Minimal padding for a line-only style */
  margin: 10px 0;
  border: none;
  border-bottom: 1.5px solid #d3dbe3; /* Light grey underline */
  background: transparent;
  color: #0d1b2c;
  font-size: 15px;
  outline: none;
}
.light-input:focus {
  border-color: #0d1b2c; /* Highlight underline on focus */
}
/* Placeholder text color */
.light-input::placeholder {
  color: #8fa0b5;
  opacity: 0.8;
}

/* New button styles for light cards */
.btn-outline {
  width: 100%;
  padding: 16px;
  margin-top: 15px;
  border: 1.5px solid #0d1b2c;
  border-radius: 30px; /* Fully rounded */
  background: transparent;
  color: #0d1b2c;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
}
.btn-outline:active { transform: scale(.98); }

.btn-filled {
  width: 100%;
  padding: 16px;
  margin-top: 15px;
  border: 1.5px solid #0d1b2c;
  border-radius: 30px; /* Fully rounded */
  background: rgba(22, 102, 158, 0.15); /* Light blue background like the image */
  color: #0d1b2c;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
.btn-filled:active { transform: scale(.98); }

.btn-filled-large {
  width: 100%;
  padding: 20px;
  margin-top: 30px;
  border: 1.5px solid #0d1b2c;
  border-radius: 30px;
  background: #e1e9f1; /* Light grey filled */
  color: #0d1b2c;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}
.btn-filled-large:active { transform: scale(.98); }


/* Sign Up specific link at the bottom */
.signup-link-container {
  margin-top: 30px;
  font-size: 13px;
  color: #8fa0b5;
}
.signup-link {
  color: #0d1b2c;
  font-weight: bold;
  text-decoration: none;
  cursor: pointer;
}

/* Simple graphic placeholder for the Welcome card illustration */
.welcome-illustration {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 250px;
  margin-bottom: 25px;
  background-color: transparent;
}
/* This is a simple visual replacement for the image content */
.placeholder-graphic {
  position: relative;
  width: 80%;
  height: 200px;
  background: white;
}
.placeholder-sofa {
  position: absolute;
  bottom: 0; left: 10%; width: 80%; height: 60px;
  background-color: #f0f4f8; /* Light blueish sofa base */
  border-radius: 8px 8px 0 0;
}
.placeholder-user {
  position: absolute;
  bottom: 50px; left: 35%; width: 30%; height: 100px;
  background-color: #8397aa; /* Simple user graphic color */
  border-radius: 5px;
}
.placeholder-laptop {
  position: absolute;
  bottom: 90px; left: 45%; width: 10%; height: 20px;
  background-color: #3d5872; /* Laptop */
}
.placeholder-light-circle {
  position: absolute;
  top: 10%; right: 10%; width: 40px; height: 40px;
  border-radius: 50%;
  background: transparent;
  border: 1.5px solid #d3dbe3;
}
.placeholder-dark-circle {
  position: absolute;
  top: 60%; left: 10%; width: 25px; height: 25px;
  border-radius: 50%;
  background-color: #d7e7f5;
}
.placeholder-light-box {
  position: absolute;
  bottom: 60%; left: 10%; width: 30px; height: 30px;
  background: transparent;
  border: 1.5px solid #d3dbe3;
}
.placeholder-light-triangle {
  position: absolute;
  bottom: 60%; right: 10%; width: 30px; height: 30px;
  background: transparent;
  border: 1.5px solid #d3dbe3;
  clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
}
.placeholder-plant {
  position: absolute;
  bottom: 20px; right: 15%; width: 20px; height: 40px;
  background-color: transparent;
  border-left: 2px solid #8397aa;
}

#login, #signup { display: none; }
#welcome { display: block; }

/* Error messages on light cards */
.light-error {
  min-height: 22px;
  margin-top: 10px;
  color: #ff687b;
  text-align: center;
  font-size: 14px;
}

</style>
</head>

<body>

<div style="position:fixed; top:5%; left:5%; font-size:80px; color:rgba(255,255,255,0.1); font-weight:bold; letter-spacing: -2px; pointer-events:none;">BOOM!</div>

<div class="card card-light" id="welcome">

  <div class="light-title">Wellcome</div>
  <div class="light-sub">Here you log in securely</div>

  <div class="welcome-illustration">
    <div class="placeholder-graphic">
        <div class="placeholder-sofa"></div>
        <div class="placeholder-user"></div>
        <div class="placeholder-laptop"></div>
        <div class="placeholder-dark-circle"></div>
        <div class="placeholder-light-box"></div>
        <div class="placeholder-light-triangle"></div>
        <div class="placeholder-plant"></div>
        <div class="placeholder-light-circle"></div>

  </div>

  <button class="btn-outline" onclick="showLogin()">Log in</button>
  <button class="btn-filled" onclick="showSignUp()">Sign Up</button>

</div>


<!-- 2. LOGIN CARD (New, simplified login from original code but light style) -->

<div class="card card-light" id="login">

  <div class="icon">📶</div>

  <div class="light-title">WiFi Packages</div>
  <div class="light-sub">Log in to manage your account</div>

  <input
    id="username"
    type="text"
    placeholder="Username"
    autocomplete="username"
    class="light-input"
  >

  <input
    id="password"
    type="password"
    placeholder="Login Password"
    autocomplete="current-password"
    class="light-input"
  >

  <div class="light-error" id="error-login"></div>

  <button class="btn-filled-large" onclick="login()">Log In</button>

  <div class="signup-link-container">
    <span class="signup-link" onclick="showSignUp()">Create Account instead</span>
  </div>

</div>
