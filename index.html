<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audio</title>
</head>
<body>
<audio id="audio" src="audio_1_minute.mp3" autoplay loop></audio>
<script>
const a = document.getElementById('audio');
a.play().catch(() => {
  document.body.innerHTML = '<button style="font-size:24px;padding:20px" onclick="audio.play()">▶ START</button>';
});
</script>
</body>
</html>
